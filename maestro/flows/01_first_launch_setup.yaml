# Proves a brand new install can generate an SSH key, render the whole
# setup form, accept a profile, and land on Home.
#
# Every element is addressed by the identifiers declared in
# lib/core/testing/semantic_ids.dart. No screen coordinates.
appId: com.darkcodex.helm
tags:
  - smoke
  - regression
env:
  HELM_HOST: "127.0.0.1"
  HELM_PORT: "22"
  HELM_USERNAME: "invalid-user"
  HELM_PROFILE_NAME: "E2E Unreachable Host"
---
- launchApp:
    clearState: true

# ── Step 1: the SSH key section ─────────────────────────────────────────
# The id proves the element is THERE on both platforms; the text proves
# the COPY is right, and only Android can still see plain-Text copy —
# measured: these titles never reach the iOS accessibility tree.
# Dropping the text assertion entirely would silently stop guarding the
# wording on the platform that can still check it.
- assertVisible:
    id: "helm.setup.screen_title"
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "Setup"

- assertVisible:
    id: "helm.setup.section_ssh_key"
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "SSH Key"

# The key is generated asynchronously in initState, so wait for it rather
# than asserting immediately.
- extendedWaitUntil:
    visible:
      id: "helm.setup.public_key_text"
    timeout: 20000

# The generated key must actually be an ed25519 public key, not an empty
# placeholder box.
- assertVisible: "ssh-ed25519 .*"
- assertVisible:
    id: "helm.setup.copy_public_key_button"

# ── Step 2: the connection form ─────────────────────────────────────────
- assertVisible:
    id: "helm.setup.section_connection_details"
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "Connection Details"
- assertVisible:
    id: "helm.setup.profile_name_field"
- assertVisible:
    id: "helm.setup.host_field"
- assertVisible:
    id: "helm.setup.port_field"
- assertVisible:
    id: "helm.setup.username_field"
- assertVisible:
    id: "helm.setup.save_button"

# ── Fill it in and continue ─────────────────────────────────────────────
# Pre-filled with "My Mac"; inputText appends, so clear it first.
- tapOn:
    id: "helm.setup.profile_name_field"
- eraseText
- inputText: "${HELM_PROFILE_NAME}"
- runFlow:
    file: ../subflows/dismiss_keyboard.yaml

- tapOn:
    id: "helm.setup.host_field"
- inputText: "${HELM_HOST}"
- runFlow:
    file: ../subflows/dismiss_keyboard.yaml

- tapOn:
    id: "helm.setup.port_field"
- eraseText
- inputText: "${HELM_PORT}"
- runFlow:
    file: ../subflows/dismiss_keyboard.yaml

- tapOn:
    id: "helm.setup.username_field"
- inputText: "${HELM_USERNAME}"
- runFlow:
    file: ../subflows/dismiss_keyboard.yaml

- tapOn:
    id: "helm.setup.save_button"

# ── We are on Home with a persisted profile ─────────────────────────────
# Anchored on the empty state's BUTTON rather than on the words "No
# active sessions" above it, matching `reach_home.yaml`: plain Flutter
# `Text` widgets never reach the iOS accessibility tree.
- extendedWaitUntil:
    visible:
      id: "helm.home.new_session_button"
    timeout: 15000
# The overflow button, not the hamburger that used to sit here: the
# shortcuts drawer was retired once herdr's own sidebar was confirmed to
# cover the navigation it duplicated, and `helm.home.drawer_button` no
# longer exists. This asserts the same thing it always did — Home came up
# with its app bar intact.
- assertVisible:
    id: "helm.home.app_bar_overflow_button"
- assertVisible:
    id: "helm.home.new_session_button"
