name: helm_agentd
description: >-
  helm-agentd: the Mac-side daemon that supervises Pi in RPC mode. This
  package holds the Pi process supervisor (spawn, restart with backoff,
  orderly shutdown).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.3

dependencies:
  helm_protocol:
    path: ../helm_protocol

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
