name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned to commits, not tags: a tag can be moved under us.
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # subosito/flutter-action v2.21.0
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The editor formats on save, so unformatted files get rewritten under
      # every review. Failing here keeps the whole tree formatted.
      - name: Check formatting
        run: >-
          dart format --set-exit-if-changed -o none
          lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # The push notifier is stdlib-only Python plus openssl (mocked in tests), so
  # the runner's system python3 is enough: no setup-python, no pip.
  notifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Test
        run: python3 -m unittest discover -s host/notifier/tests
