name: helm
description: "Helm — Remote Mac control via SSH and tmux."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # SSH
  dartssh2: ^3.3.1

  # Terminal emulation
  xterm: ^4.0.0

  # Biometric auth
  local_auth: ^2.3.0

  # Secure storage (SSH keys)
  flutter_secure_storage: ^10.0.0

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.3

  # Fonts
  google_fonts: ^6.2.1

  # Code generation (models)
  freezed_annotation: ^2.4.4

  # SharedPreferences for profile storage
  shared_preferences: ^2.3.4

  # UUID generation
  uuid: ^4.5.1

  # Ed25519 key generation (transitive via dartssh2, declared explicitly)
  pinenacl: ^0.6.0

  path_provider: ^2.1.6
  open_filex: ^4.7.0

  # Storage Access Framework, for saving a download into a folder the user
  # picks. PINNED EXACTLY, not `^`, and the reason is the toolchain: 3.0.0
  # of both raised their floor to Dart `^3.12.0` / Flutter `>=3.44.0`, and
  # this app builds on 3.41.7 / Dart 3.11.5. These two are the last
  # versions that resolve here, so a caret would silently stop resolving
  # the moment either publishes again.
  #
  # `saf_util` picks the folder and holds the persisted grant;
  # `saf_stream` does the copy into it. Both are needed: the picker cannot
  # write and the writer cannot pick.
  saf_util: 2.2.0
  saf_stream: 2.0.0

  # Push notifications. PINNED EXACTLY, for the same toolchain reason as
  # `saf_util`/`saf_stream` above: these three are the newest versions whose
  # `flutter` constraint still admits 3.41.7 / Dart 3.11.5, and every one of
  # them declares `sdk: ^3.6.0` today. A caret would resolve fine now and
  # silently stop resolving the moment any of them publishes a release that
  # raises its floor, which is exactly how the SAF pair broke.
  #
  # `firebase_core` initialises from `lib/firebase_options.dart`;
  # `firebase_messaging` obtains the token and delivers messages;
  # `flutter_local_notifications` exists ONLY for the foreground case —
  # FCM does not draw a tray notification while the app is in front, so
  # without it a message that arrives mid-session is silently dropped.
  firebase_core: 4.14.0
  firebase_messaging: 16.6.0
  flutter_local_notifications: 22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Virtual clock for tests that must elapse a real Duration without
  # spending it. Already resolved transitively via flutter_test; declared
  # explicitly because test code imports it directly.
  fake_async: ^1.3.1

  # Code generation
  freezed: ^2.5.7
  json_serializable: ^6.9.2
  build_runner: ^2.4.13

  # Writes android/app/src/main/res/mipmap-*/ from the art in assets/icon/.
  #
  # A GENERATOR, not a runtime dependency: it is run by hand, its output is
  # committed, and nothing in the build invokes it. Pinned exactly rather
  # than with a caret for the same reason as saf_stream above — it has not
  # published in over a year, so a caret buys no upgrades and only widens
  # what could resolve differently on someone else's machine.
  #
  #   dart run flutter_launcher_icons
  #
  # Re-run it only after changing assets/icon/, which
  # `tool/generate_launcher_icon.py` draws.
  flutter_launcher_icons: 0.14.4

# Configuration for the generator above. Read by `dart run
# flutter_launcher_icons` and by nothing else — deleting this block breaks
# no build, it only means the icons cannot be regenerated from source.
#
# assets/icon/ is deliberately NOT listed under `flutter:` `assets:`: these
# are build-time source art, and shipping them inside the APK would pay for
# three 1024px PNGs the app never opens.
flutter_launcher_icons:
  android: true
  # No Runner.xcodeproj in this repo — helm is Android-only today, and
  # asking for iOS output makes the generator fail rather than skip.
  ios: false
  image_path: "assets/icon/helm_icon.png"
  # A flat colour rather than a background image: the layer is parallaxed
  # and zoomed by the launcher, and a colour cannot show a seam when it is.
  adaptive_icon_background: "#0D1117"
  adaptive_icon_foreground: "assets/icon/helm_icon_foreground.png"
  # Android 13+ themed icons. The system keeps only this layer's ALPHA and
  # re-tints it from the wallpaper, exactly as it does a notification small
  # icon — so the art is the same glyph drawn flat white.
  adaptive_icon_monochrome: "assets/icon/helm_icon_monochrome.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true
