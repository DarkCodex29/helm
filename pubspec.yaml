name: helm
description: "Helm — Remote Mac control via SSH and tmux."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # SSH
  dartssh2: ^3.3.1

  # Terminal emulation
  xterm: ^4.0.0

  # Biometric auth
  local_auth: ^2.3.0

  # Secure storage (SSH keys)
  flutter_secure_storage: ^10.0.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.3

  # Fonts
  google_fonts: ^6.2.1

  # Code generation (models)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # SharedPreferences for profile storage
  shared_preferences: ^2.3.4

  # UUID generation
  uuid: ^4.5.1

  # Ed25519 key generation (transitive via dartssh2, declared explicitly)
  pinenacl: ^0.6.0

  # SHA-256 host key fingerprints
  crypto: ^3.0.6
  path_provider: ^2.1.6
  open_filex: ^4.7.0

  # Storage Access Framework, for saving a download into a folder the user
  # picks. PINNED EXACTLY, not `^`, and the reason is the toolchain: 3.0.0
  # of both raised their floor to Dart `^3.12.0` / Flutter `>=3.44.0`, and
  # this app builds on 3.41.7 / Dart 3.11.5. These two are the last
  # versions that resolve here, so a caret would silently stop resolving
  # the moment either publishes again.
  #
  # `saf_util` picks the folder and holds the persisted grant;
  # `saf_stream` does the copy into it. Both are needed: the picker cannot
  # write and the writer cannot pick.
  saf_util: 2.2.0
  saf_stream: 2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Virtual clock for tests that must elapse a real Duration without
  # spending it. Already resolved transitively via flutter_test; declared
  # explicitly because test code imports it directly.
  fake_async: ^1.3.1

  # Code generation
  freezed: ^2.5.7
  json_serializable: ^6.9.2
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
